<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Partage des Frais - Lourdes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#2f4b82; --blue2:#34528a; --gold:#c8a24a;
    --bg:#f4f7fb; --pos:#3f7d5a; --neg:#b25563;
    --ink:#1f2430; --muted:#8a91a3; --line:#e2e8f2;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#dfe6f1;color:var(--ink);-webkit-font-smoothing:antialiased;}
  .serif{font-family:'Cormorant Garamond',serif;}
  a{color:var(--blue);}
  input:focus,select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(47,75,130,.12);}
  ::placeholder{color:#a8b0c2;}

  .app{display:flex;flex-direction:column;height:100dvh;height:100vh;max-width:560px;margin:0 auto;background:var(--bg);box-shadow:0 0 60px rgba(31,45,80,.25);overflow:hidden;}
  @supports(height:100dvh){.app{height:100dvh;}}

  /* ---- en-tête ---- */
  .header{position:relative;flex-shrink:0;height:180px;overflow:hidden;background:#24304f;}
  .header img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 22%;}
  .header .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,28,50,.2) 0%,rgba(20,28,50,.2) 40%,rgba(30,42,72,.85) 100%);}
  .header .inner{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;padding:14px 24px 12px;color:#fff;}
  .eyebrow{font-size:10px;font-weight:600;letter-spacing:.24em;color:#e3c586;text-transform:uppercase;}
  .header h1{font-weight:600;font-size:26px;line-height:1.1;margin-top:2px;text-shadow:0 2px 12px rgba(0,0,0,.4);}
  .sync-row{display:flex;align-items:center;gap:8px;margin-top:8px;}
  .sync-status{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.16);backdrop-filter:blur(8px);padding:5px 10px;border-radius:20px;font-size:11.5px;}
  .sync-dot{width:7px;height:7px;border-radius:50%;background:#79c79a;animation:pulse 2s infinite;}
  .sync-dot.syncing{background:#e3c586;}
  .sync-dot.error{background:#e0776b;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .sync-btn{display:flex;align-items:center;gap:5px;background:#fff;color:var(--blue);border:none;padding:5px 12px;border-radius:20px;font-size:11.5px;font-weight:600;cursor:pointer;}
  .gear{position:absolute;top:10px;right:12px;width:30px;height:30px;border-radius:50%;border:none;background:rgba(255,255,255,.85);color:#5a6178;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;}

  /* ---- contenu ---- */
  .content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .section{display:none;padding:24px 20px 32px;flex-direction:column;gap:18px;}
  .section.active{display:flex;animation:fade .3s;}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  h2.title{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:27px;}
  h3.sub{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:21px;margin-top:4px;}

  .card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 6px 18px rgba(47,75,130,.06);}
  .form{display:flex;flex-direction:column;gap:15px;}
  label{display:block;font-weight:600;font-size:13.5px;color:#48506a;margin-bottom:7px;}
  input,select{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;font-size:16px;font-family:inherit;background:#fbfcfe;}
  .btn{align-self:flex-start;background:linear-gradient(180deg,var(--blue2),var(--blue));color:#fff;border:none;padding:13px 24px;border-radius:12px;font-weight:600;font-size:15px;cursor:pointer;}
  .btn:active{transform:translateY(1px);}

  .list{display:flex;flex-direction:column;gap:12px;}
  .family-item{background:#fff;border-radius:14px;padding:16px 18px;box-shadow:0 5px 14px rgba(47,75,130,.05);display:flex;align-items:center;gap:14px;border-left:4px solid var(--blue2);}
  .family-item .name{font-weight:600;font-size:16px;}
  .family-item .meta{font-size:13px;color:var(--muted);margin-top:2px;}
  .mini{border:none;border-radius:9px;font-weight:600;cursor:pointer;font-family:inherit;}
  .mini.edit{background:#eef2fa;color:var(--blue);padding:8px 12px;font-size:13px;}
  .mini.del{background:#fbe9ec;color:var(--neg);width:34px;height:34px;font-size:17px;}

  .exp-item{background:#fff;border-radius:14px;padding:14px 16px;box-shadow:0 5px 14px rgba(47,75,130,.05);display:flex;align-items:center;gap:12px;}
  .exp-item .name{font-weight:600;font-size:15px;}
  .exp-item .desc{font-size:13.5px;color:#6b7285;margin-top:1px;}
  .exp-item .date{font-size:12px;color:#a8b0c2;margin-top:3px;}
  .exp-item .amt{font-weight:700;font-size:16px;color:var(--pos);font-variant-numeric:tabular-nums;}

  .summary{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .summary .k{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:#98a0b2;}
  .summary .v{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:27px;color:var(--blue);margin-top:3px;}
  .summary-foot{border-top:1px solid #eef1f6;margin-top:14px;padding-top:12px;font-size:13px;color:#7a8195;}

  .bal-card{background:#fff;border-radius:14px;padding:15px 17px;box-shadow:0 5px 14px rgba(47,75,130,.05);border-left:4px solid var(--gold);}
  .bal-card .top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;}
  .bal-card .fam{font-weight:600;font-size:16px;}
  .bal-card .fam small{font-weight:400;color:var(--muted);font-size:13px;}
  .bal-card .solde{font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .bal-card .rows{display:flex;gap:18px;margin-top:8px;font-size:13px;color:#6b7285;}
  .bal-card .rows strong{color:#414a61;}
  .bal-card .status{margin-top:8px;font-size:12px;font-weight:600;}

  .transfers{background:linear-gradient(180deg,#f7f2e6,#f4eddc);border:1px solid rgba(200,162,74,.4);border-radius:20px;padding:20px;}
  .transfers h3{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:21px;color:#7a5c1f;margin-bottom:4px;}
  .transfers .hint{font-size:12.5px;color:#9c7f45;margin-bottom:16px;}
  .tr-card{background:#fff;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 4px 12px rgba(122,92,31,.08);}
  .tr-card.done{opacity:.62;}
  .tr-top{display:flex;align-items:center;gap:8px;}
  .tr-party{flex:1;min-width:0;}
  .tr-party.r{text-align:right;}
  .tr-lab{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;}
  .tr-lab.from{color:var(--neg);}
  .tr-lab.to{color:var(--pos);}
  .tr-name{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tr-mid{text-align:center;flex-shrink:0;}
  .tr-amt{font-weight:700;font-size:17px;color:var(--blue);font-variant-numeric:tabular-nums;}
  .tr-arrow{font-size:15px;color:var(--gold);line-height:1;}
  .tr-btn{width:100%;border:none;border-radius:10px;padding:10px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;background:var(--blue);color:#fff;}
  .tr-btn.done{background:#eaf3ee;color:var(--pos);}

  .empty{text-align:center;padding:32px 20px;color:#9aa2b4;}
  .empty .big{font-family:'Cormorant Garamond',serif;font-size:19px;color:#7a8195;}
  .empty .small{font-size:13.5px;margin-top:6px;}

  /* ---- barre onglets ---- */
  .tabs{flex-shrink:0;display:flex;background:#fff;border-top:1px solid #e7ebf3;padding:9px 8px calc(9px + env(safe-area-inset-bottom,6px));}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:transparent;border:none;border-radius:12px;padding:8px 4px;font-size:11px;font-weight:500;cursor:pointer;font-family:inherit;color:#a3abbd;}
  .tab .ic{font-size:20px;}
  .tab.active{color:var(--blue);font-weight:600;background:rgba(47,75,130,.08);}

  @media(max-width:768px){
    .tabs{position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(255,255,255,.98);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid rgba(0,0,0,.1);box-shadow:0 -2px 10px rgba(0,0,0,.05);padding-bottom:calc(9px + env(safe-area-inset-bottom,6px));}
    .app{height:auto;min-height:100dvh;min-height:100vh;padding-bottom:72px;}
    @supports(min-height:100dvh){.app{min-height:100dvh;}}
  }

  /* ---- admin ---- */
  .admin-overlay{position:fixed;inset:0;z-index:900;background:rgba(20,28,50,.35);display:none;}
  .admin-overlay.active{display:block;}
  .admin-panel{position:fixed;top:60px;right:16px;left:16px;max-width:340px;margin-left:auto;z-index:901;background:#fff;border-radius:16px;box-shadow:0 20px 50px rgba(20,28,50,.3);padding:20px;display:none;}
  .admin-panel.active{display:block;}
  .admin-panel h3{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:21px;margin-bottom:14px;}
  .admin-col{display:flex;flex-direction:column;gap:9px;}
  .abtn{border:none;border-radius:11px;padding:11px;font-weight:600;font-size:14px;cursor:pointer;font-family:inherit;}
  .abtn.primary{background:linear-gradient(180deg,var(--blue2),var(--blue));color:#fff;}
  .abtn.exp{background:#eaf3ee;color:#2f6b4a;}
  .abtn.year{background:#fef3e2;color:#a06b1f;}
  .abtn.clear{background:#fbe9ec;color:var(--neg);}
  .abtn.out{background:#f1f3f7;color:#6b7285;}

  /* ---- message / loading ---- */
  .message{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:1100;padding:13px 22px;border-radius:12px;font-size:14px;font-weight:500;box-shadow:0 8px 24px rgba(20,28,50,.2);display:none;max-width:92%;}
  .message.show{display:block;animation:drop .3s;}
  @keyframes drop{from{transform:translate(-50%,-14px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
  .message.success{background:#eaf3ee;color:#2f6b4a;}
  .message.error{background:#fbe9ec;color:var(--neg);}
  .loading{position:fixed;inset:0;z-index:1000;background:rgba(20,28,50,.72);display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;}
  .loading.active{display:flex;}
  .spinner{width:48px;height:48px;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading-text{color:#fff;font-size:15px;text-align:center;line-height:1.5;white-space:pre-line;}
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <img src="grotte-lourdes.jpg" alt="Grotte de Lourdes">
    <div class="veil"></div>
    <div class="inner">
      <div class="eyebrow">Pèlerinage · Lourdes 2026</div>
      <h1 class="serif">Partage des frais</h1>
      <div class="sync-row">
        <div class="sync-status"><span class="sync-dot" id="syncDot"></span><span id="syncText">Synchronisé</span></div>
        <button class="sync-btn" onclick="forceSync()">↻ Synchroniser</button>
      </div>
    </div>
    <button class="gear" onclick="toggleAdmin()" title="Administration">⚙</button>
  </div>

  <div class="content">
    <!-- FAMILLES -->
    <div id="families" class="section active">
      <h2 class="title serif">Gestion des familles</h2>
      <div class="card form">
        <div><label>Nom de la famille</label><input type="text" id="familyName" placeholder="Ex : Famille Martin"></div>
        <div><label>Nombre de membres</label><input type="number" id="familyMembers" min="1" placeholder="Ex : 5"></div>
        <button class="btn" id="addFamilyBtn">Ajouter la famille</button>
      </div>
      <div class="list" id="familiesList"></div>
    </div>

    <!-- DÉPENSES -->
    <div id="expenses" class="section">
      <h2 class="title serif">Saisie des dépenses</h2>
      <div class="card form">
        <div><label>Qui a avancé les frais ?</label>
          <select id="expensePayer"><option value="">Sélectionner une famille</option></select>
        </div>
        <div><label>Montant (€)</label><input type="number" id="expenseAmount" step="0.01" min="0" placeholder="Ex : 125,50"></div>
        <div><label>Description</label><input type="text" id="expenseDescription" placeholder="Ex : Courses pour le repas commun"></div>
        <button class="btn" id="addExpenseBtn">Ajouter la dépense</button>
      </div>
      <h3 class="sub serif">Dernières dépenses</h3>
      <div class="list" id="expensesList"></div>
    </div>

    <!-- BILAN -->
    <div id="balance" class="section">
      <h2 class="title serif">Bilan &amp; répartition</h2>
      <div id="balanceSummary"></div>
      <div class="transfers" id="transfersSection" style="display:none;">
        <h3>Virements à effectuer</h3>
        <p class="hint">Chaque famille en rouge verse à une famille en vert. Cochez quand c'est réglé.</p>
        <div class="list" id="transfersList"></div>
      </div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="families"><span class="ic">☖</span>Familles</button>
    <button class="tab" data-tab="expenses"><span class="ic">＋</span>Dépenses</button>
    <button class="tab" data-tab="balance"><span class="ic">◆</span>Bilan</button>
  </div>

  <div class="admin-overlay" id="adminOverlay" onclick="toggleAdmin()"></div>
  <div class="admin-panel" id="adminPanel">
    <h3 class="serif">Administration</h3>
    <div class="admin-col" id="adminLogin">
      <input type="password" id="adminCode" placeholder="Code admin">
      <button class="abtn primary" onclick="checkAdmin()">Valider</button>
    </div>
    <div class="admin-col" id="adminActions" style="display:none;">
      <div style="color:var(--pos);font-weight:600;font-size:13.5px;">✓ Mode admin activé</div>
      <button class="abtn exp" onclick="exportData()">Exporter les données</button>
      <button class="abtn year" onclick="resetYear()">Nouvelle année</button>
      <button class="abtn clear" onclick="clearAll()">Tout effacer</button>
      <button class="abtn out" onclick="logoutAdmin()">Déconnexion</button>
    </div>
  </div>

  <div id="message" class="message"></div>
  <div class="loading" id="loadingOverlay"><div class="spinner"></div><div class="loading-text">Un instant… 🙏</div></div>
</div>

<script>
  // ======== CONFIGURATION ========
  const SHEET_ID = '1jKYQJXIdB-b5MjvSkiM5QVMqNNEJUjSGe-1sCZvEkEo';
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyANb6RvSSLspeqLOuQ7-L0cYIsgAp8KSHzllonEd25OPywaLNIFcyHEIJgi3RGStrl-Q/exec';
  const ADMIN_CODE = '333';

  const appState = {
    families: [], expenses: [], isAdmin: false, isSyncing: false,
    currentYear: new Date().getFullYear(), settled: {}
  };
  window.appState = appState;
  let isAddingFamily = false, isAddingExpense = false;

  const fmt = n => (Number(n)||0).toFixed(2).replace('.', ',') + ' €';

  // ======== INIT ========
  document.addEventListener('DOMContentLoaded', init);
  async function init(){
    document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => switchTab(t.dataset.tab)));
    document.getElementById('addFamilyBtn').addEventListener('click', addFamily);
    document.getElementById('addExpenseBtn').addEventListener('click', addExpense);
    ['familyName','familyMembers'].forEach(id => document.getElementById(id).addEventListener('keypress', e => { if(e.key==='Enter') addFamily(); }));
    loadFromCache(); loadSettled(); updateUI();
    await syncFromSheet();
  }

  // ======== CACHE LOCAL ========
  function loadFromCache(){
    try{ const c = localStorage.getItem('lourdes_data'); if(c){ const d = JSON.parse(c); appState.families = d.families||[]; appState.expenses = d.expenses||[]; } }catch(e){ console.error(e); }
  }
  function saveToCache(){
    try{ localStorage.setItem('lourdes_data', JSON.stringify({families:appState.families,expenses:appState.expenses,lastSync:new Date().toISOString()})); }catch(e){ console.error(e); }
  }
  function loadSettled(){
    try{ const s = localStorage.getItem('lourdes_settled'); if(s) appState.settled = JSON.parse(s)||{}; }catch(e){}
  }
  function saveSettled(){
    try{ localStorage.setItem('lourdes_settled', JSON.stringify(appState.settled)); }catch(e){}
  }

  // ======== SYNCHRONISATION ========
  async function syncFromSheet(){
    if(appState.isSyncing) return;
    appState.isSyncing = true; updateSyncStatus('syncing');
    try{
      // Ajout de &t=Date.now() pour contourner le cache CDN de Google gviz (essentiel pour iOS & sync temps réel)
      const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Data&t=${Date.now()}`;
      const res = await fetch(url, {cache: 'no-store'});
      if(!res.ok) throw new Error('lecture impossible');
      parseDataSheet(await res.text());
      saveToCache(); saveSettled(); updateUI();
      const t = new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
      updateSyncStatus('synced'); document.getElementById('syncText').textContent = 'Sync ' + t;
    }catch(e){
      console.error('sync', e); updateSyncStatus('error');
    }finally{ appState.isSyncing = false; }
  }
  function parseDataSheet(csv){
    const lines = csv.split('\n'), families = [], expenses = [];
    const clean = s => s ? String(s).replace(/^["']|["']$/g,'').trim() : '';
    for(let i=1;i<lines.length;i++){
      const line = lines[i].trim(); if(!line) continue;
      const v = parseCSVLine(line);
      const type = clean(v[0]), id = clean(v[1]), supprime = clean(v[7]);
      if(supprime && supprime!=='') continue;
      if(type==='FAM'){ const f={id,name:clean(v[2]),members:parseInt(clean(v[3]))||1}; if(f.id&&f.name) families.push(f); }
      else if(type==='DEP'){
        const e={id,familyName:clean(v[2]),amount:parseFloat(clean(v[4]))||0,description:clean(v[5]),date:clean(v[6])||new Date().toLocaleDateString('fr-FR')};
        const f=families.find(x=>x.name===e.familyName); if(f) e.familyId=f.id;
        if(e.id&&e.amount>0) expenses.push({...e,year:appState.currentYear});
      }
    }
    // Lire les lignes REG (réglements partagés) — Le Sheet est la source de vérité
    const sheetSettled = {};
    let hasRegInSheet = false;
    for(let i=1;i<lines.length;i++){
      const line2 = lines[i].trim(); if(!line2) continue;
      const v2 = parseCSVLine(line2);
      const type2 = clean(v2[0]), supprime2 = clean(v2[7]);
      if(type2==='REG'){
        hasRegInSheet = true;
        if(!supprime2 || supprime2===''){
          const key = clean(v2[2]); // clé stockée dans col C (Nom)
          if(key) sheetSettled[key] = true;
        }
      }
    }
    appState.families = families; appState.expenses = expenses;
    // Si le sheet contient des données REG, il remplace le statut local pour assurer une vraie sync multi-appareils
    if(hasRegInSheet){
      appState.settled = sheetSettled;
    } else {
      appState.settled = {...appState.settled, ...sheetSettled};
    }
  }
  function parseCSVLine(line){
    const values=[]; let cur='',inQ=false;
    for(let i=0;i<line.length;i++){ const c=line[i];
      if(c==='"') inQ=!inQ; else if(c===','&&!inQ){ values.push(cur.trim()); cur=''; } else cur+=c; }
    values.push(cur.trim()); while(values.length<8) values.push(''); return values;
  }
  async function forceSync(){ showLoading('Synchronisation en cours… 🙏'); await syncFromSheet(); hideLoading(); showMessage('Synchronisation terminée !','success'); }

  // ======== ONGLETS ========
  function switchTab(tab){
    syncFromSheet();
    document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tab));
    document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
    document.getElementById(tab).classList.add('active');
  }

  // ======== FAMILLES ========
  async function addFamily(){
    if(isAddingFamily) return;
    const nameEl=document.getElementById('familyName'), memEl=document.getElementById('familyMembers');
    const name=nameEl.value.trim(), members=parseInt(memEl.value);
    if(!name||!members||members<1){ showMessage('Veuillez remplir tous les champs correctement','error'); return; }
    if(appState.families.some(f=>f.name.toLowerCase()===name.toLowerCase())){ showMessage('Cette famille existe déjà !','error'); return; }
    isAddingFamily=true; showLoading('Ajout de la famille…\n🙏 Sois patient, Jésus t\'aime 🙏');
    try{
      const f={id:Date.now().toString(),name,members,date:new Date().toLocaleDateString('fr-FR')};
      appState.families.push(f); saveToCache(); updateUI(); nameEl.value=''; memEl.value='';
      await saveToSheets('family',f);
      hideLoading(); showMessage(`Famille « ${name} » ajoutée !`,'success');
      setTimeout(syncFromSheet,1000);
    }catch(e){ hideLoading(); showMessage('Erreur lors de l\'ajout','error'); }
    finally{ isAddingFamily=false; }
  }
  async function deleteFamily(id){
    if(!appState.isAdmin){ showMessage('Accès administrateur requis','error'); return; }
    const f=appState.families.find(x=>x.id===id); if(!f) return;
    // B2 : confirmation enrichie avec nombre de dépenses et total
    const deps=appState.expenses.filter(e=>e.familyId===id&&e.year===appState.currentYear);
    const total=deps.reduce((s,e)=>s+e.amount,0);
    const msg=deps.length>0
      ? `La famille « ${f.name} » a ${deps.length} dépense(s) (total ${fmt(total)}).\n\nSupprimer la famille ET ses dépenses ?`
      : `Supprimer la famille « ${f.name} » ?`;
    if(!confirm(msg)) return;
    showLoading('Suppression…');
    appState.families=appState.families.filter(x=>x.id!==id);
    appState.expenses=appState.expenses.filter(e=>e.familyId!==id);
    saveToCache(); updateUI();
    await saveToSheets('delete_family',{id,familyName:f.name});
    hideLoading(); showMessage('Famille supprimée','success'); setTimeout(syncFromSheet,1000);
  }
  async function editFamilyMembers(id){
    if(!appState.isAdmin){ showMessage('Accès administrateur requis','error'); return; }
    const f=appState.families.find(x=>x.id===id); if(!f) return;
    const nm=prompt(`Nombre de membres pour ${f.name} :`,f.members); if(!nm||isNaN(nm)) return;
    f.members=parseInt(nm); saveToCache(); updateUI();
    await saveToSheets('update_family',f); showMessage('Nombre de membres modifié','success');
  }

  // ======== DÉPENSES ========
  async function addExpense(){
    if(isAddingExpense) return;
    const payEl=document.getElementById('expensePayer'), amtEl=document.getElementById('expenseAmount'), descEl=document.getElementById('expenseDescription');
    const familyId=payEl.value, amount=parseFloat(amtEl.value), description=descEl.value.trim();
    if(!familyId||!amount||amount<=0||!description){ showMessage('Veuillez remplir tous les champs correctement','error'); return; }
    isAddingExpense=true; showLoading('Enregistrement de la dépense…\n🙏 Sois patient, Jésus t\'aime 🙏');
    try{
      const e={id:Date.now().toString(),familyId,amount,description,date:new Date().toLocaleDateString('fr-FR'),year:appState.currentYear};
      appState.expenses.push(e); saveToCache(); updateUI(); payEl.value=''; amtEl.value=''; descEl.value='';
      await saveToSheets('expense',e);
      hideLoading(); showMessage('Dépense ajoutée !','success'); setTimeout(syncFromSheet,1000);
    }catch(err){ hideLoading(); showMessage('Erreur lors de l\'ajout','error'); }
    finally{ isAddingExpense=false; }
  }
  async function deleteExpense(id){
    if(!appState.isAdmin){ showMessage('Accès administrateur requis','error'); return; }
    if(!confirm('Supprimer cette dépense ?')) return;
    showLoading('Suppression…');
    appState.expenses=appState.expenses.filter(e=>e.id!==id); saveToCache(); updateUI();
    await saveToSheets('delete_expense',{id});
    hideLoading(); showMessage('Dépense supprimée','success'); setTimeout(syncFromSheet,1000);
  }

  // ======== CALCULS ========
  function calculateBalance(){
    const totalPeople=appState.families.reduce((s,f)=>s+f.members,0);
    const totalExpenses=appState.expenses.filter(e=>e.year===appState.currentYear).reduce((s,e)=>s+e.amount,0);
    if(totalPeople===0) return {perPerson:0,totalExpenses:0,totalPeople:0,familyBalances:[]};
    const costPerPerson=totalExpenses/totalPeople;
    const familyBalances=appState.families.map(family=>{
      const paid=appState.expenses.filter(e=>e.familyId===family.id&&e.year===appState.currentYear).reduce((s,e)=>s+e.amount,0);
      const owes=costPerPerson*family.members;
      return {family,paid,owes,balance:paid-owes};
    });
    return {perPerson:costPerPerson,totalExpenses,totalPeople,familyBalances};
  }
  function optimizeTransfers(balances){
    const creditors=balances.filter(b=>b.balance>0.01).map(b=>({...b})).sort((a,b)=>b.balance-a.balance);
    const debtors=balances.filter(b=>b.balance<-0.01).map(b=>({...b})).sort((a,b)=>a.balance-b.balance);
    const transfers=[];
    for(const cr of creditors){ let rem=cr.balance;
      for(const db of debtors){ if(rem<=0.01) break; if(db.balance>=-0.01) continue;
        const amount=Math.min(rem,-db.balance);
        transfers.push({from:db.family,to:cr.family,amount:Math.round(amount*100)/100});
        rem-=amount; db.balance+=amount; } }
    return transfers;
  }
  async function toggleSettled(key){
    const wasSettled = !!appState.settled[key];
    if(wasSettled) delete appState.settled[key]; else appState.settled[key]=true;
    saveSettled(); updateBalance();
    showMessage(appState.settled[key]?'Virement marqué comme réglé':'Virement remis à régler','success');
    // Sauvegarder dans le Sheet pour partage avec tous
    if(wasSettled){
      await saveToSheets('unsettle',{key});
    } else {
      await saveToSheets('settle',{key});
    }
    setTimeout(syncFromSheet,1000);
  }

  // ======== RENDU ========
  function updateUI(){ updateFamiliesList(); updateExpensesList(); updateBalance(); updatePayerSelect(); }

  function updateFamiliesList(){
    const c=document.getElementById('familiesList');
    if(!appState.families.length){ c.innerHTML='<div class="empty"><div class="big">Aucune famille enregistrée</div><div class="small">Ajoutez une famille pour commencer.</div></div>'; return; }
    c.innerHTML=appState.families.map(f=>`
      <div class="family-item">
        <div style="flex:1">
          <div class="name">${esc(f.name)}</div>
          <div class="meta">${f.members} membre${f.members>1?'s':''}</div>
        </div>
        ${appState.isAdmin?`<button class="mini edit" onclick="editFamilyMembers('${f.id}')">Modifier</button><button class="mini del" onclick="deleteFamily('${f.id}')">×</button>`:''}
      </div>`).join('');
  }

  function updateExpensesList(){
    const c=document.getElementById('expensesList');
    const rows=appState.expenses.filter(e=>e.year===appState.currentYear)
      .sort((a,b)=>b.date.split('/').reverse().join('').localeCompare(a.date.split('/').reverse().join(''))).slice(0,10);
    if(!rows.length){ c.innerHTML='<div class="empty"><div class="small">Aucune dépense enregistrée.</div></div>'; return; }
    c.innerHTML=rows.map(e=>{
      const f=appState.families.find(x=>x.id===e.familyId);
      return `<div class="exp-item">
        <div style="flex:1">
          <div class="name">${f?esc(f.name):(esc(e.familyName)||'Famille inconnue')}</div>
          <div class="desc">${esc(e.description)}</div>
          <div class="date">${esc(e.date)}</div>
        </div>
        <div class="amt">${fmt(e.amount)}</div>
        ${appState.isAdmin?`<button class="mini del" onclick="deleteExpense('${e.id}')">🗑</button>`:''}
      </div>`;
    }).join('');
  }

  function updateBalance(){
    const c=document.getElementById('balanceSummary');
    const sec=document.getElementById('transfersSection'), tl=document.getElementById('transfersList');
    const {perPerson,totalExpenses,totalPeople,familyBalances}=calculateBalance();
    if(!familyBalances.length||totalExpenses===0){
      c.innerHTML='<div class="empty"><div class="big">Rien à répartir pour l\'instant</div><div class="small">Ajoutez des familles et des dépenses pour voir le bilan.</div></div>';
      sec.style.display='none'; return;
    }
    c.innerHTML=`
      <div class="card">
        <div class="summary">
          <div><div class="k">Total avancé</div><div class="v">${fmt(totalExpenses)}</div></div>
          <div><div class="k">Coût par personne</div><div class="v">${fmt(perPerson)}</div></div>
        </div>
        <div class="summary-foot">${totalPeople} pèlerins · ${appState.families.length} famille${appState.families.length>1?'s':''}</div>
      </div>
      <h3 class="sub serif" style="margin-top:6px">Situation par famille</h3>
      <div class="list">
        ${familyBalances.map(fb=>{
          const pos=fb.balance>0.01,neg=fb.balance<-0.01;
          const col=pos?'var(--pos)':neg?'var(--neg)':'var(--gold)';
          const status=pos?'On lui doit de l\'argent':neg?'Doit régler':'Équilibré';
          return `<div class="bal-card" style="border-left-color:${col}">
            <div class="top">
              <div class="fam">${esc(fb.family.name)} <small>(${fb.family.members} pers.)</small></div>
              <div class="solde" style="color:${col}">${fb.balance>0?'+':''}${fmt(fb.balance)}</div>
            </div>
            <div class="rows"><span>A avancé : <strong>${fmt(fb.paid)}</strong></span><span>Doit payer : <strong>${fmt(fb.owes)}</strong></span></div>
            <div class="status" style="color:${col}">${status}</div>
          </div>`;
        }).join('')}
      </div>`;

    const transfers=optimizeTransfers([...familyBalances]);
    if(!transfers.length){ sec.style.display='none'; return; }
    sec.style.display='block';
    tl.innerHTML=transfers.map(t=>{
      const key=`${t.from.id}|${t.to.id}|${t.amount}`;
      const done=!!appState.settled[key];
      return `<div class="tr-card ${done?'done':''}">
        <div class="tr-top">
          <div class="tr-party"><div class="tr-lab from">Verse</div><div class="tr-name">${esc(t.from.name)}</div></div>
          <div class="tr-mid"><div class="tr-amt">${fmt(t.amount)}</div><div class="tr-arrow">──▸</div></div>
          <div class="tr-party r"><div class="tr-lab to">Reçoit</div><div class="tr-name">${esc(t.to.name)}</div></div>
        </div>
        <button class="tr-btn ${done?'done':''}" onclick="toggleSettled('${key}')">${done?'✓ Réglé — annuler':'Marquer comme réglé'}</button>
      </div>`;
    }).join('');
  }

  function updatePayerSelect(){
    const sel=document.getElementById('expensePayer'), cur=sel.value;
    sel.innerHTML='<option value="">Sélectionner une famille</option>'+appState.families.map(f=>`<option value="${f.id}">${esc(f.name)}</option>`).join('');
    if(cur) sel.value=cur;
  }
  function updateSyncStatus(status){
    const dot=document.getElementById('syncDot'), text=document.getElementById('syncText');
    dot.className='sync-dot '+ (status==='synced'?'':status);
    if(status==='syncing') text.textContent='Synchronisation…';
    else if(status==='error') text.textContent='Hors ligne';
    else if(status==='synced') text.textContent='Synchronisé';
  }

  // ======== ADMIN ========
  function toggleAdmin(){
    const p=document.getElementById('adminPanel'), o=document.getElementById('adminOverlay');
    const open=p.classList.toggle('active'); o.classList.toggle('active',open);
  }
  function checkAdmin(){
    if(document.getElementById('adminCode').value===ADMIN_CODE){
      appState.isAdmin=true;
      document.getElementById('adminLogin').style.display='none';
      document.getElementById('adminActions').style.display='flex';
      document.getElementById('adminCode').value='';
      showMessage('Mode administrateur activé','success'); updateUI();
    } else showMessage('Code incorrect','error');
  }
  function logoutAdmin(){
    appState.isAdmin=false;
    document.getElementById('adminLogin').style.display='flex';
    document.getElementById('adminActions').style.display='none';
    toggleAdmin(); showMessage('Mode administrateur désactivé','success'); updateUI();
  }
  function exportData(){
    const data={date:new Date().toISOString(),year:appState.currentYear,families:appState.families,expenses:appState.expenses};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`lourdes-${appState.currentYear}-export.json`; a.click();
    showMessage('Données exportées','success');
  }
  function resetYear(){
    if(!confirm('Commencer une nouvelle année ? Les dépenses seront effacées mais les familles conservées.')) return;
    showLoading('Initialisation nouvelle année…');
    appState.currentYear=new Date().getFullYear(); appState.expenses=[]; saveToCache(); updateUI();
    saveToSheets('reset_year',{year:appState.currentYear}); hideLoading(); showMessage('Nouvelle année initialisée','success');
  }
  function clearAll(){
    if(!confirm('⚠️ Tout effacer définitivement ?')) return;
    if(!confirm('⚠️ DERNIÈRE CONFIRMATION ! Action irréversible !')) return;
    showLoading('Suppression totale…');
    appState.families=[]; appState.expenses=[]; saveToCache(); updateUI();
    saveToSheets('clear_all',{}); hideLoading(); showMessage('Toutes les données ont été effacées','success');
  }

  // ======== SAUVEGARDE SHEETS ========
  async function saveToSheets(action,data){
    try{
      let payload={};
      if(action==='family') payload={type:'FAM',id:data.id,name:data.name,members:data.members,action:'add'};
      else if(action==='expense'){ const f=appState.families.find(x=>x.id===data.familyId); payload={type:'DEP',id:data.id,familyName:f?f.name:'Inconnue',amount:data.amount,description:data.description,date:data.date,action:'add'}; }
      else if(action==='delete_family'||action==='delete_expense'){ payload={action:'delete',id:data.id}; if(action==='delete_family'&&data.familyName) payload.familyName=data.familyName; }
      else if(action==='update_family') payload={action:'update',type:'FAM',id:data.id,members:data.members};
      else if(action==='settle') payload={action:'add',type:'REG',id:Date.now().toString(),name:data.key};
      else if(action==='unsettle') payload={action:'unsettle',key:data.key};
      else if(action==='clear_all') payload={action:'clear_all'};
      else if(action==='reset_year') payload={action:'reset_year',year:data.year};
      await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(payload)});
      return true;
    }catch(e){ console.error('saveToSheets',e); return false; }
  }

  // ======== UTILITAIRES ========
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
  function showMessage(text,type){ const m=document.getElementById('message'); m.textContent=text; m.className='message show '+type; setTimeout(()=>m.classList.remove('show'),3000); }
  function showLoading(text){ const o=document.getElementById('loadingOverlay'); o.querySelector('.loading-text').textContent=text||'Un instant… 🙏'; o.classList.add('active'); }
  function hideLoading(){ document.getElementById('loadingOverlay').classList.remove('active'); }

  // sync au retour sur la page
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&!appState.isSyncing) syncFromSheet(); });
  window.addEventListener('focus',()=>{ if(!appState.isSyncing) syncFromSheet(); });
</script>
